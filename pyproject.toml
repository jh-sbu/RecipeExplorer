[project]
name = "recipe-explorer"
version = "0.1.0"
description = "Local recipe explorer for WoW Forever, built from client DB2 data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
ui = ["datasette>=0.65,<1.0"]

[project.scripts]
rex = "recipe_explorer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
